# 用法：git submodule update --init --recursive
#       docker compose up -d --build
# 账号数据在 ./data（和直接跑二进制时同一个位置）。
#
# 母镜像不写在这份文件里。build.context 指向当前目录的 Dockerfile：
#   编译底：docker.io/library/golang:1.22-bookworm  （Debian 12 + Go + 可装 g++）
#   运行底：docker.io/library/debian:bookworm-slim  （精简 Debian 12，带 libstdc++）
# 不是 Ubuntu。Debian 和 Ubuntu 都用 apt，Debian slim 更小。
# 你的电脑/云主机可以是 Ubuntu、Debian 或任何装着 Docker 的系统；
# 容器里面自带上面那套 Linux，不依赖主机上有没有 Ubuntu。
services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        GOPROXY: ${GOPROXY:-https://proxy.golang.org,direct}
    image: gbmj-server:local
    ports:
      - "8080:8080"
    volumes:
      - ./data:/app/data
      - ./configs/prod.yaml:/app/configs/prod.yaml:ro
    restart: unless-stopped
    ulimits:
      nofile:
        soft: 65535
        hard: 65535
